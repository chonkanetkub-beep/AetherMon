namespace: minecraft
path: overworld
# ── Lobby world settings ──────────────────────────────────────
# doMobSpawning: false = no Pokémon, animals, or monsters spawn in the lobby.
# This ONLY affects the lobby (minecraft:overworld).
# The survival world (multiworld:survival) is unaffected and spawns normally.
gamerules:
  doMobSpawning: "false"
  doWeatherCycle: "false"
  doDaylightCycle: "false"
  keepInventory: "true"
