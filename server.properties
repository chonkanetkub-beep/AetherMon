#Minecraft server properties
#Aethermon - Cobblemon Survival Server (Fabric 1.21.1)
#Last edited: 2026-09-30

# ── CONNECTION ───────────────────────────────────────────────────
# online-mode: Players must own a real Minecraft account. NEVER disable on live server.
online-mode=true
server-ip=
server-port=25565
prevent-proxy-connections=false
accepts-transfers=false

# ── WHITELIST ────────────────────────────────────────────────────
# white-list: Only approved players can join. Turn off at public launch.
# enforce-whitelist: If you update the whitelist while server is running,
#   this kicks anyone who is no longer on it immediately.
white-list=true
enforce-whitelist=true

# ── WORLD ────────────────────────────────────────────────────────
# level-name: The main world folder loaded on startup (our lobby world).
level-name=lobby
level-type=minecraft\:normal
level-seed=
generate-structures=true
allow-nether=true
hardcore=false
gamemode=survival
force-gamemode=false
difficulty=normal

# ── PERFORMANCE ──────────────────────────────────────────────────
# view-distance: How many chunks the server sends to each player.
#   8 = good balance for 6GB RAM. Default is 10. Raise later if performance allows.
view-distance=8
# simulation-distance: How far the server "ticks" (moves mobs, grows crops, etc.)
#   6 = significantly reduces CPU load without affecting gameplay much.
simulation-distance=6
# entity-broadcast-range-percentage: How far away entity positions are sent to players.
#   80 = reduces network traffic vs default 100.
entity-broadcast-range-percentage=80
# sync-chunk-writes: Safer chunk saving (prevents corruption on crash).
sync-chunk-writes=true
# max-tick-time: Server will halt if a single tick takes longer than this (ms).
#   60000 = 60 seconds. Prevents runaway freezes.
max-tick-time=60000
max-chained-neighbor-updates=1000000
max-world-size=29999984
network-compression-threshold=256
region-file-compression=deflate

# ── PLAYERS ──────────────────────────────────────────────────────
# max-players: Max concurrent players. Start small, raise at launch.
max-players=10
# player-idle-timeout: Kick AFK players after 30 minutes (saves RAM/slots).
#   Set to 0 to disable.
player-idle-timeout=30
# spawn-protection: Blocks building near world spawn (0=disabled).
#   We use Multiworld/Lobby to protect spawn instead.
spawn-protection=0
hide-online-players=false

# ── MOBS & SPAWNING ──────────────────────────────────────────────
# spawn-animals: MUST be TRUE for Cobblemon Pokémon to appear in the world!
spawn-animals=true
# spawn-monsters: Needed for hostile Pokémon encounters and wild battles.
spawn-monsters=true
spawn-npcs=true

# ── PVP ──────────────────────────────────────────────────────────
# pvp: Global PvP is OFF. Designated zone PvP will be configured separately.
pvp=false

# ── SERVER INFO ──────────────────────────────────────────────────
# motd: Text shown in the Minecraft server list.
#   \u00A7b = aqua, \u00A7l = bold, \u00A7r = reset, \u00A7f = white
motd=\u00A7b\u00A7lAethermon \u00A7r\u00A7f| Cobblemon Survival

# ── PERMISSIONS & OPS ────────────────────────────────────────────
op-permission-level=4
function-permission-level=2
enable-command-block=false
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true

# ── SECURITY ─────────────────────────────────────────────────────
enforce-secure-profile=true
log-ips=true
rate-limit=0

# ── RCON (remote console) ─────────────────────────────────────────
# Disabled for now. Enable and set a strong password if you need remote admin.
enable-rcon=false
rcon.port=25575
rcon.password=

# ── QUERY (server list info) ─────────────────────────────────────
enable-query=false
query.port=25565

# ── RESOURCE PACK ────────────────────────────────────────────────
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=

# ── MISC ─────────────────────────────────────────────────────────
enable-jmx-monitoring=false
enable-status=true
allow-flight=false
use-native-transport=true
initial-disabled-packs=
initial-enabled-packs=vanilla
text-filtering-config=
bug-report-link=
